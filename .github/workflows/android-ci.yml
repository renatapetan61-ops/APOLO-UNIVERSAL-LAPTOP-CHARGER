name: Android CI
on:
  push:
    paths:
      - "android/**"
      - "simulator/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "simulator/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulator unit tests
        run: python -m unittest discover -s simulator -p "test_*.py" -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle :android:app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :android:app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apolo-charger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed release APK (optional)
        if: ${{ vars.APOLO_RELEASE_ENABLED == 'true' }}
        env:
          APOLO_RELEASE_KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
          APOLO_RELEASE_STORE_FILE: ${{ runner.temp }}/apolo-release.jks
        run: |
          set -euo pipefail
          test -n "$APOLO_RELEASE_KEYSTORE_BASE64" || { echo "Missing APOLO_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$APOLO_RELEASE_STORE_PASSWORD" || { echo "Missing APOLO_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$APOLO_RELEASE_KEY_ALIAS" || { echo "Missing APOLO_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$APOLO_RELEASE_KEY_PASSWORD" || { echo "Missing APOLO_RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$APOLO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$APOLO_RELEASE_STORE_FILE"
          chmod 600 "$APOLO_RELEASE_STORE_FILE"
          gradle :android:app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          rm -f "$APOLO_RELEASE_STORE_FILE"
      - name: Upload signed release APK
        if: ${{ vars.APOLO_RELEASE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-charger-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
