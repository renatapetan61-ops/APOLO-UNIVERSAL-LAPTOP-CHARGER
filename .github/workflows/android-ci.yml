name: Android CI
on:
  push:
    paths:
      - "android/**"
      - "simulator/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "simulator/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  virtual-sensor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile and execute seven virtual sensor adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apolo-sensor-output
          rustc bms-virtual-sensors/rust/src/main.rs -o /tmp/apolo-rust-sensor
          /tmp/apolo-rust-sensor > /tmp/apolo-sensor-output/rust.json
          python bms-virtual-sensors/python/sensor.py > /tmp/apolo-sensor-output/python.json
          (cd bms-virtual-sensors/go && go run main.go) > /tmp/apolo-sensor-output/go.json
          ruby bms-virtual-sensors/ruby/sensor.rb > /tmp/apolo-sensor-output/ruby.json
          cc -Wall -Wextra -Werror bms-virtual-sensors/c/sensor.c -o /tmp/apolo-c-sensor
          /tmp/apolo-c-sensor > /tmp/apolo-sensor-output/c.json
          c++ -std=c++17 -Wall -Wextra -Werror bms-virtual-sensors/cpp/sensor.cpp -o /tmp/apolo-cpp-sensor
          /tmp/apolo-cpp-sensor > /tmp/apolo-sensor-output/cpp.json
          dotnet new console --output /tmp/apolo-csharp --framework net8.0 --no-restore
          cp bms-virtual-sensors/csharp/Program.cs /tmp/apolo-csharp/Program.cs
          dotnet restore /tmp/apolo-csharp
          dotnet run --project /tmp/apolo-csharp --no-restore > /tmp/apolo-sensor-output/csharp.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("/tmp/apolo-sensor-output").glob("*.json")):
              data = json.loads(path.read_text())
              assert data["protocol"] == "apolo-bms-telemetry/1", path
              assert data["source_type"] == "SIMULATED", path
              assert data["hardware_backed"] is False, path
              assert data["output_authorized"] is False, path
              assert data["sensor"] == "pack_temperature", path
              print(f"PASS {path.stem}: {data['source_id']}")
          assert len(list(Path("/tmp/apolo-sensor-output").glob("*.json"))) == 7
          PY

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulator unit tests
        run: python -m unittest discover -s simulator -p "test_*.py" -v

  android:
    needs: [simulator-tests, virtual-sensor-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle :android:app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :android:app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apolo-charger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed release APK (optional)
        if: ${{ vars.APOLO_RELEASE_ENABLED == 'true' }}
        env:
          APOLO_RELEASE_KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
          APOLO_RELEASE_STORE_FILE: ${{ runner.temp }}/apolo-release.jks
        run: |
          set -euo pipefail
          test -n "$APOLO_RELEASE_KEYSTORE_BASE64" || { echo "Missing APOLO_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$APOLO_RELEASE_STORE_PASSWORD" || { echo "Missing APOLO_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$APOLO_RELEASE_KEY_ALIAS" || { echo "Missing APOLO_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$APOLO_RELEASE_KEY_PASSWORD" || { echo "Missing APOLO_RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$APOLO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$APOLO_RELEASE_STORE_FILE"
          chmod 600 "$APOLO_RELEASE_STORE_FILE"
          echo "Validating release keystore and alias..."
          keytool -list -keystore "$APOLO_RELEASE_STORE_FILE" -storepass "$APOLO_RELEASE_STORE_PASSWORD" -alias "$APOLO_RELEASE_KEY_ALIAS" -v
          gradle :android:app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          rm -f "$APOLO_RELEASE_STORE_FILE"
      - name: Upload signed release APK
        if: ${{ vars.APOLO_RELEASE_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-charger-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
